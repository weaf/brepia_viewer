<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Brepia Viewer · CodeMirror 6 evaluation</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; background: #10151f; color: #e9edf4; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow-x: hidden; }
      button, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: default; opacity: .48; }
      button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid #76b8ec; outline-offset: 1px; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .workspace { display: flex; flex-direction: column; width: 100%; height: 100dvh; min-height: 0; padding: 6px; gap: 4px; max-width: 1440px; margin: auto; }
      /* One compact chrome row; hit targets remain 44px while visual tiles are 30px. */
      .toolbar { position: relative; z-index: 5; display: flex; flex: 0 0 48px; flex-wrap: nowrap; align-items: center; height: 48px; min-height: 48px; gap: 3px; padding: 1px 4px; border: 1px solid #354054; border-radius: 8px; background: #192231; }
      .file-picker { width: clamp(66px, 24vw, 165px); min-width: 0; flex: 0 1 auto; height: 44px; min-height: 44px; padding: 0 16px 0 7px; border: 0; border-radius: 5px; background: transparent; color: #e9edf4; font-size: 12px; text-overflow: ellipsis; }
      .file-picker:hover { background: #29384c; }
      .toolbar-divider { display: block; height: 22px; flex: 0 0 1px; background: #344256; margin: 0 2px; }
      .toolbar-spacer { flex: 1 1 auto; min-width: 0; }
      .svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
      .icon { position: relative; z-index: 1; display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
      .tool-menu { flex: 0 0 44px; }
      .tool-icon { position: relative; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 44px; width: 44px; min-width: 44px; height: 44px; min-height: 44px; padding: 0; border: 0; background: transparent; color: #c9d6e6; }
      .tool-icon::before { content: ''; position: absolute; inset: 7px; border-radius: 6px; background: #263243; transition: background-color 100ms ease; }
      .tool-icon:hover::before, .tool-menu[open] > summary::before { background: #35506b; }
      .tool-menu > summary { cursor: pointer; list-style: none; }
      .tool-menu > summary::-webkit-details-marker { display: none; }
      .tool-menu > summary::marker { content: ''; }
      .save-action { position: relative; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 70px; gap: 4px; min-width: 70px; width: 70px; height: 44px; min-height: 44px; padding: 0; border: 0; background: transparent; font-size: 12px; font-weight: 650; color: #fff; }
      .save-action::before { content: ''; position: absolute; inset: 6px 1px; border-radius: 6px; background: #17649c; }
      .save-action:hover::before { background: #2479b4; }
      .save-action:disabled::before { background: #2c3a4a; }
      .save-action span { position: relative; z-index: 1; }
      .save-action .icon { width: 16px; height: 16px; }
      /* Menus overlay the code area; they never force a second toolbar row. */
      .menu-panel { position: absolute; z-index: 20; left: 2px; top: calc(100% + 4px); width: min(330px, calc(100vw - 14px)); max-height: min(62dvh, 470px); overflow-y: auto; overscroll-behavior: contain; border: 1px solid #58677b; border-radius: 9px; background: #192432; box-shadow: 0 16px 40px #0009; padding: 9px; }
      .menu-panel-wide { width: min(420px, calc(100vw - 14px)); }
      .panel-title { font-size: 13px; font-weight: 650; padding: 0 2px 7px; }
      .menu-section { padding-block: 6px; border-top: 1px solid #344256; }
      .menu-section h2 { font-size: 12px; color: #aec4dc; font-weight: 600; margin: 0 0 5px; }
      .menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
      .menu-list { display: grid; gap: 5px; }
      .menu-panel button { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; min-height: 44px; padding: 7px 9px; text-align: left; border: 1px solid #475468; border-radius: 6px; background: #242f40; font-size: 12px; }
      .menu-panel button:hover { background: #314259; }
      .menu-panel button small { font-size: 10px; color: #9eaec2; white-space: nowrap; }
      .menu-note { margin: 9px 2px 1px; padding-top: 8px; border-top: 1px solid #344256; font-size: 11px; line-height: 1.5; color: #a9b9ce; }
      .menu-panel button.compact-selection-action { display: none; }
      #editor { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow: hidden; border: 1px solid #354054; border-radius: 7px; }
      #editor .cm-editor { flex: 1 1 auto; min-height: 0; width: 100%; font-size: 14px; }
      #editor .cm-scroller { overflow: auto; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      footer { display: flex; flex: 0 0 18px; align-items: center; justify-content: space-between; gap: 8px; min-height: 18px; overflow: hidden; padding-inline: 5px; font-size: 11px; color: #a9b9ce; }
      #status { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      #status[data-dirty="true"] { color: #fac783; }
      #position { flex: 0 0 auto; }
      @media (max-width: 375px) {
        /* At 320px, hide only a secondary menu; its actions remain in More. */
        #selection-menu { display: none; }
        .menu-panel button.compact-selection-action { display: flex; }
        .file-picker { width: clamp(66px, 23vw, 82px); padding-left: 3px; }
      }
      @media (min-width: 800px) {
        .workspace { padding: 8px; gap: 6px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .tool-icon::before { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="workspace">
      <h1 class="visually-hidden">Brepia Viewer · OpenSCAD editor prototype</h1>
      <svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16 16 5 5"/></symbol>
        <symbol id="i-shapes" viewBox="0 0 24 24"><path d="m3 8 6-4 6 4v8l-6 4-6-4Z M3 8l6 4 6-4 M9 12v8"/><circle cx="18" cy="17" r="3.5"/></symbol>
        <symbol id="i-select" viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="7" rx="1"/><rect x="13" y="12" width="8" height="7" rx="1"/><path d="m11 8 5 4 M13 4v4 M11 18l-5 2"/></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
        <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h12l4 4v14H3V3h2Z M7 3v7h10V3 M6 21v-8h12v8"/></symbol>
      </svg>
      <nav class="toolbar" aria-label="Editor tools">
        <select id="file" class="file-picker" aria-label="Open project file" title="Open project file">
          <option value="main.scad">main.scad</option>
          <option value="lib/shape.scad">lib/shape.scad</option>
        </select>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button id="find" class="tool-icon" type="button" aria-label="Find / replace" title="Find / replace">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        </button>
        <details id="insert-menu" class="tool-menu">
          <summary class="tool-icon" role="button" tabindex="0" aria-label="Insert OpenSCAD code" title="Insert OpenSCAD code">
            <svg class="icon" aria-hidden="true"><use href="#i-shapes"/></svg>
          </summary>
          <div class="menu-panel menu-panel-wide" role="group" aria-label="OpenSCAD snippets">
            <div class="panel-title">Insert OpenSCAD code</div>
            <section class="menu-section" aria-label="Primitives">
              <h2>Primitives</h2>
              <div class="menu-grid">
                <button id="cube" data-snippet="cube" type="button" aria-label="Cube">Cube <small aria-hidden="true">Box</small></button>
                <button data-snippet="sphere" type="button" aria-label="Sphere">Sphere <small aria-hidden="true">Round</small></button>
                <button data-snippet="cylinder" type="button" aria-label="Cylinder">Cylinder <small aria-hidden="true">Tube</small></button>
              </div>
            </section>
            <section class="menu-section" aria-label="Transformations">
              <h2>Transformations</h2>
              <div class="menu-grid">
                <button id="translate" data-snippet="translate" type="button" aria-label="Translate">Translate <small aria-hidden="true">Move</small></button>
                <button data-snippet="rotate" type="button" aria-label="Rotate">Rotate</button>
                <button data-snippet="scale" type="button" aria-label="Scale">Scale</button>
                <button data-snippet="mirror" type="button" aria-label="Mirror">Mirror</button>
              </div>
            </section>
            <section class="menu-section" aria-label="Boolean operations">
              <h2>Boolean operations</h2>
              <div class="menu-grid">
                <button data-snippet="union" type="button" aria-label="Union">Union</button>
                <button data-snippet="difference" type="button" aria-label="Difference">Difference</button>
                <button data-snippet="intersection" type="button" aria-label="Intersection">Intersection</button>
              </div>
            </section>
            <section class="menu-section" aria-label="Model and programming">
              <h2>Model and programming</h2>
              <div class="menu-grid">
                <button data-snippet="color" type="button" aria-label="Color">Color</button>
                <button data-snippet="linear-extrude" type="button" aria-label="Linear extrude">Linear extrude</button>
                <button data-snippet="rotate-extrude" type="button" aria-label="Rotate extrude">Rotate extrude</button>
                <button data-snippet="module" type="button" aria-label="Module">Module</button>
                <button data-snippet="function" type="button" aria-label="Function">Function</button>
                <button data-snippet="for" type="button" aria-label="For loop">For loop</button>
                <button data-snippet="if-else" type="button" aria-label="If / else">If / else</button>
                <button data-snippet="parameter" type="button" aria-label="Parameter">Parameter</button>
              </div>
            </section>
          </div>
        </details>
        <details id="selection-menu" class="tool-menu">
          <summary class="tool-icon" role="button" tabindex="0" aria-label="Selection tools" title="Selection tools">
            <svg class="icon" aria-hidden="true"><use href="#i-select"/></svg>
          </summary>
          <div class="menu-panel" role="group" aria-label="Selection actions">
            <div class="panel-title">Selection tools</div>
            <div class="menu-list">
              <button id="next" type="button" aria-label="Next match">Next match <small aria-hidden="true">Add cursor</small></button>
              <button id="all" type="button" aria-label="Select all matches">Select all matches <small aria-hidden="true">Multi-edit</small></button>
            </div>
          </div>
        </details>
        <details id="more-menu" class="tool-menu">
          <summary class="tool-icon" role="button" tabindex="0" aria-label="More editor tools" title="More editor tools">
            <svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>
          </summary>
          <div class="menu-panel" role="group" aria-label="Additional editor actions">
            <div class="panel-title">Editor tools</div>
            <div class="menu-list">
              <button id="complete" type="button" aria-label="Complete">Complete <small aria-hidden="true">Ctrl+Space</small></button>
              <button id="line" type="button" aria-label="Go to line">Go to line</button>
              <button id="discard" type="button" aria-label="Discard">Discard <small aria-hidden="true">Restore saved content</small></button>
              <button id="next-compact" class="compact-selection-action" type="button" aria-label="Next match">Next match <small aria-hidden="true">Add cursor</small></button>
              <button id="all-compact" class="compact-selection-action" type="button" aria-label="Select all matches">Select all matches <small aria-hidden="true">Multi-edit</small></button>
            </div>
            <p class="menu-note">Prototype only · Saves stay in memory; reload resets sample files. No real model storage or rendering.</p>
          </div>
        </details>
        <span class="toolbar-spacer" aria-hidden="true"></span>
        <button id="save" class="primary save-action" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-save"/></svg><span>Save</span>
        </button>
      </nav>
      <section id="editor" aria-label="OpenSCAD editor"></section>
      <footer>
        <span id="status" role="status">Unchanged</span>
        <span id="position">Line 1, column 1</span>
      </footer>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
