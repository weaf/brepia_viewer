name: CodeMirror React editor integration checks

on:
  push:
    branches: ['prototype/codemirror6-openscad-editor']
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/components/parameter/**'
      - 'src/lib/openScadSnippets*'
      - '.github/scripts/static-viewer-smoke.mjs'
      - '.github/workflows/integration-codemirror-editor.yml'
  workflow_dispatch:

concurrency:
  group: codemirror-react-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Resolve and retain updated root dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile for repository commit
        uses: actions/upload-artifact@v4
        with:
          name: codemirror-integration-lockfile
          path: package-lock.json
          if-no-files-found: error
      - name: Install exact resolved dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, lint, unit tests, production build
        run: npm run check
      - name: Build static viewer including OpenSCAD WebAssembly
        run: STATIC_VIEWER=1 VITE_STATIC_VIEWER=1 npm run build
      - name: Playwright gallery / editor Save-Discard / rendering / export
        run: node .github/scripts/static-viewer-smoke.mjs
      - name: Retain static screenshots, logs and browser findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codemirror-integration-evidence
          path: ${{ runner.temp }}/viewer-static-evidence/
          if-no-files-found: warn
