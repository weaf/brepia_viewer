name: One-time nonbreaking dependency security remediation

on:
  push:
    branches: [experiment/static-viewer-hosting]
    paths: [.github/workflows/security-remediation-sandbox.yml]

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Upgrade npm package manager inside the disposable runner only
        run: |
          npm install -g npm@11 --no-audit --no-fund
          npm --version

      - name: Install exact baseline
        run: npm ci --no-fund --no-audit

      - name: Refresh vulnerable dependencies within allowed semver
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --no-fund
          status=$?
          echo "npm audit fix exit: $status"
          if [ "$status" -ne 0 ]; then
            echo "Attempt targeted semver-compatible refresh of vulnerable packages."
            npm update dompurify undici vite seroval --package-lock-only --no-fund
            echo "Targeted refresh exit: $?"
          fi
          echo "No --force or audit bypass is used."
          exit 0

      - name: Verify reproducible dependency install
        run: npm ci --no-fund --no-audit

      - name: Run server compatibility checks
        run: npm run check

      - name: Run static build and browser render/export checks
        run: |
          STATIC_VIEWER=1 VITE_STATIC_VIEWER=1 npm run build
          node .github/scripts/static-viewer-smoke.mjs

      - name: Record remaining security findings
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high
          status=$?
          echo "Audit exit: $status (remediation continues only on the test branch)"
          echo "Existing security gate is NOT changed or bypassed."
          exit 0

      - name: Commit compatible lockfile-only remediations to experiment branch
        shell: bash
        run: |
          set -e
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible changes to commit."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix compatible vulnerable transitive dependencies in lockfile"
          git push origin HEAD:experiment/static-viewer-hosting
