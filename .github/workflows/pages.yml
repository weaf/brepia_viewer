name: Publish Brepia Viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brepia-viewer-github-pages
  cancel-in-progress: true

jobs:
  diagnose-domain:
    name: Probe public domain independently of deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check public DNS, HTTP and HTTPS
        run: |
          echo "DNS:"
          getent ahosts viewer.notydesign.se || true
          for url in \
            'https://viewer.notydesign.se/' \
            'http://viewer.notydesign.se/' \
            'https://viewer.notydesign.se/editor/' \
            'https://weaf.github.io/brepia_viewer/'; do
            echo "Checking $url"
            curl -sS -L --connect-timeout 8 --max-time 20 \
              -o /dev/null \
              -w 'HTTP=%{http_code} EFFECTIVE=%{url_effective} SSL_VERIFY=%{ssl_verify_result} REMOTE_IP=%{remote_ip}\n' \
              "$url" || echo "Connection failed for $url"
          done

          echo "Response headers through Cloudflare:"
          curl -sS --max-time 15 -D - -o /dev/null 'https://viewer.notydesign.se/'             | grep -Ei '^(HTTP/|server:|cf-|location:|x-github-|content-type:)' || true

          echo "Compare the GitHub Pages origin directly, bypassing Cloudflare:"
          curl -sS --connect-timeout 8 --max-time 20             --resolve viewer.notydesign.se:443:185.199.108.153             -o /dev/null             -w 'ORIGIN_HTTPS=%{http_code} SSL_VERIFY=%{ssl_verify_result} IP=%{remote_ip}\n'             'https://viewer.notydesign.se/' || true
          curl -sS --connect-timeout 8 --max-time 20             --resolve viewer.notydesign.se:80:185.199.108.153             -o /dev/null             -w 'ORIGIN_HTTP=%{http_code} IP=%{remote_ip}\n'             'http://viewer.notydesign.se/' || true

  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STATIC_VIEWER_BASE: "/"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-fund --no-audit

      - name: Build static GitHub Pages variant
        run: STATIC_VIEWER=1 VITE_STATIC_VIEWER=1 npm run build

      - name: Verify custom-domain root, OpenSCAD, desktop/mobile and STL
        run: node .github/scripts/static-viewer-smoke.mjs

      - name: Keep legacy /editor address working
        run: |
          mkdir -p .output/public/editor
          cat > .output/public/editor/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <meta http-equiv="refresh" content="0; url=/" />
              <title>Brepia Viewer – opening editor</title>
              <script>location.replace("/");</script>
            </head>
            <body><a href="/">Open Brepia Viewer</a></body>
          </html>
          HTML

      - name: Include Pages static metadata
        run: touch .output/public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static distribution
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Diagnose published custom-domain availability
        if: ${{ steps.deployment.outcome == 'success' }}
        run: |
          for url in \
            'https://viewer.notydesign.se/' \
            'https://viewer.notydesign.se/editor/' \
            'http://viewer.notydesign.se/' \
            'https://weaf.github.io/brepia_viewer/'; do
            echo "Checking $url"
            curl -sS -L --connect-timeout 8 --max-time 20 \
              -o /dev/null \
              -w 'HTTP=%{http_code} EFFECTIVE=%{url_effective} SSL_VERIFY=%{ssl_verify_result}\n' \
              "$url" || echo "Connection failed for $url"
          done
