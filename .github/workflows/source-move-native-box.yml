name: Source Move native Box proof

on:
  pull_request:
    paths:
      - "src/lib/sourceMove*"
      - ".github/workflows/source-move-native-box.yml"

permissions:
  contents: read

jobs:
  native-box-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-fund
      - name: Install native OpenSCAD
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends openscad
      - name: Download pinned real Box fixture
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/Noty-design/Parametric-designs/1a2175071735ec265009ddf26c8b62cd3449960f/Box/L%C3%A5da_V4.scad" \
            --output "${RUNNER_TEMP}/box.scad"
          test -s "${RUNNER_TEMP}/box.scad"
      - name: Verify code to lid to translated OFF while other faces stay unchanged
        run: npx vitest run src/lib/sourceMoveBoxNative.test.ts --reporter=verbose
        env:
          SOURCE_MOVE_NATIVE_BOX: "1"
          SOURCE_MOVE_BOX_FILE: ${{ runner.temp }}/box.scad
