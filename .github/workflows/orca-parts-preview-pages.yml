name: Isolated Orca Parts 3MF preview

on:
  push:
    branches:
      - feature/orca-parts-color-preservation
    paths:
      - .github/workflows/orca-parts-preview-pages.yml
      - .github/scripts/static-viewer-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Serialize Pages deployments; never interrupt the production deployment.
concurrency:
  group: brepia-viewer-github-pages
  cancel-in-progress: false

jobs:
  isolated-preview:
    if: github.ref == 'refs/heads/feature/orca-parts-color-preservation'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: orca-parts-preview
      url: https://viewer.notydesign.se/orca-parts-preview/
    steps:
      - name: Checkout candidate without touching main
        uses: actions/checkout@v6
        with:
          path: candidate
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Restore exact current live Pages artifact; guard main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_sha="$(gh api repos/weaf/brepia_viewer/git/ref/heads/main --jq .object.sha)"
          expected_sha="d9fc5b1b8c5fada0dcefd3e3c2af97ca5bd96d13"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::Main has changed; refusing preview deployment to avoid replacing new production files"
            exit 1
          fi
          mkdir -p /tmp/brepia-live-archive /tmp/brepia-live-root composite/.output/public
          gh run download 42463976287 --repo weaf/brepia_viewer \
            --name github-pages --dir /tmp/brepia-live-archive
          test -f /tmp/brepia-live-archive/artifact.tar
          tar -xf /tmp/brepia-live-archive/artifact.tar -C /tmp/brepia-live-root
          cp -a /tmp/brepia-live-root/. composite/.output/public/
          diff -qr /tmp/brepia-live-root composite/.output/public
          echo "PASS: original production root exactly preserved"

      - name: Build isolated preview assets and run standard checks
        run: |
          set -euo pipefail
          cd candidate
          npm ci --no-fund --no-audit
          npm run check
          STATIC_VIEWER=1 VITE_STATIC_VIEWER=1 \
            STATIC_VIEWER_BASE=/orca-parts-preview/ \
            VITE_PREVIEW_STORAGE_NAMESPACE=orcaparts16 \
            npm run build
          if ! grep -R -l 'brepia-local-models-preview-orcaparts16' .output/public/assets >/dev/null; then
            echo "::error::Preview-local IndexedDB isolation is missing"
            exit 1
          fi

      - name: Verify desktop and mobile OpenSCAD and export at preview path
        run: |
          set -euo pipefail
          cd candidate
          STATIC_VIEWER_BASE=/orca-parts-preview/ \
            VITE_PREVIEW_STORAGE_NAMESPACE=orcaparts16 \
            node .github/scripts/static-viewer-smoke.mjs

      - name: Append preview without modifying the live site
        run: |
          set -euo pipefail
          mkdir -p composite/.output/public/orca-parts-preview/
          cp -a candidate/.output/public/. composite/.output/public/orca-parts-preview/
          diff -qr /tmp/brepia-live-root composite/.output/public \
            --exclude=orca-parts-preview
          test -f composite/.output/public/orca-parts-preview/index.html
          echo "PASS: root and existing paths unchanged; only isolated preview appended"

      - uses: actions/configure-pages@v6

      - name: Upload composite Pages archive
        uses: actions/upload-pages-artifact@v5
        with:
          path: composite/.output/public

      - name: Deploy isolated preview (no main merge)
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Output preview URL
        run: |
          echo "TEST_URL=https://viewer.notydesign.se/orca-parts-preview/"
          echo "Production root bytes were not changed; preview uses isolated browser model storage."
