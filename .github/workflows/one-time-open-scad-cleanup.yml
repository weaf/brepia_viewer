name: One-time OpenSCAD-only cleanup

on:
  push:
    branches: [cleanup/openscad-only]
    paths:
      - .github/workflows/one-time-open-scad-cleanup.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install exact baseline
        run: npm ci --no-fund --no-audit
      - name: Remove unreachable Brepia subsystems and unused runtime packages
        run: node .github/scripts/one-time-open-scad-cleanup.mjs
      - name: Commit isolated cleanup candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --stat | tail -35
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove legacy CAD and AI systems; keep OpenSCAD-only Viewer"
          git push origin HEAD:cleanup/openscad-only
      - name: Regenerate route tree and check candidate build
        run: |
          npx vite build
          npm run check
      - name: Validate runtime dependency security
        run: npm audit --omit=dev --audit-level=high
