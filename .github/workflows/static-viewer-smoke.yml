name: Brepia Viewer static smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STATIC_VIEWER_BASE: "/"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-fund --no-audit

      - name: Build GitHub Pages custom-domain output
        run: STATIC_VIEWER=1 VITE_STATIC_VIEWER=1 npm run build

      - name: Inspect generated static payload
        run: |
          echo "Prerendered home HTML:"
          sed -n "1,10p" .output/public/index.html | cut -c 1-1500
          echo "Top-level static assets:"
          find .output/public -maxdepth 2 -type f | head -40
          echo "Static payload total:"
          du -sh .output/public
          echo "OpenSCAD assets:"
          find .output/public -iname '*openscad*' -o -name '*.wasm'

      - name: Test static HTTP + model gallery and OpenSCAD rendering
        run: node .github/scripts/static-viewer-smoke.mjs

      - name: Test GitHub OpenSCAD URL imports in desktop and mobile Chrome
        run: node .github/scripts/github-url-import-smoke.mjs

      - name: Verify two-file OpenSCAD editing and parameter sliders
        run: node .github/scripts/multifile-editor-smoke.mjs

      - name: Retain test results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-viewer-smoke
          path: ${{ runner.temp }}/viewer-static-evidence/
          if-no-files-found: warn
