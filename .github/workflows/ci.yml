name: Brepia Viewer CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-fund
      - name: Lint, test and production build
        run: npm run check
      - name: Runtime security audit (high and critical)
        run: npm audit --omit=dev --audit-level=high
