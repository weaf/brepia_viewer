name: Bootstrap standalone Brepia Viewer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-viewer.yml
      - .bootstrap/viewer.patch.b64

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Viewer repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct standalone Viewer tree
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/.bootstrap/viewer.patch.b64"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          git clone --quiet --no-tags https://github.com/weaf/brepia.git "$work/source"
          git -C "$work/source" checkout --quiet 109d4b535573162487e059716ab14b636d45929c

          base64 -d "$GITHUB_WORKSPACE/.bootstrap/viewer.patch.b64" > "$work/viewer.patch"
          git -C "$work/source" apply --binary "$work/viewer.patch"
          rm -rf "$work/source/.git"

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$work/source"/. "$GITHUB_WORKSPACE"/

          cd "$GITHUB_WORKSPACE"
          git add -A
          git config user.name "Brepia Viewer Bootstrap"
          git config user.email "brepia-viewer@users.noreply.github.com"
          git commit -m "Bootstrap standalone Brepia Viewer"
          git push origin HEAD:main
